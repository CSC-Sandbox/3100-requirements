name: Protect Story Assignments

on:
  issues:
    types: [assigned, unassigned]

permissions:
  issues: write

jobs:
  protect-story-assignment:
    # Instructor can always change assignments.
    # Ignore changes made by bots, including this Action.
    if: >
      github.event.sender.login != 'javiergs' &&
      github.event.sender.type != 'Bot'

    runs-on: ubuntu-latest

    steps:
      - name: Protect assignments
        uses: actions/github-script@v8
        with:
          script: |
            const issue = context.payload.issue;
            const action = context.payload.action;
            const changedUser = context.payload.assignee?.login;

            // Read labels.
            const labels = (issue.labels || []).map(label =>
              typeof label === "string" ? label : label.name
            );

            // Read GitHub Issue Type, if available in the event.
            const issueType = issue.type?.name;

            console.log(
              `Issue #${issue.number}: type=${issueType}, labels=${labels.join(", ")}`
            );

            // -------------------------------------------------------
            // TASKS ARE THE ONLY EXCEPTION.
            // Allow assignment changes if:
            //   1. Issue Type is Task, OR
            //   2. The issue has the Task label.
            // -------------------------------------------------------
            const isTask =
              issueType === "Task" ||
              labels.includes("Task");

            if (isTask) {
              console.log(
                "Task detected. Assignment change is allowed."
              );
              return;
            }

            // -------------------------------------------------------
            // EVERYTHING ELSE IS PROTECTED.
            // -------------------------------------------------------
            if (!changedUser) {
              console.log("No changed assignee found.");
              return;
            }

            console.log(
              `Unauthorized ${action} of ${changedUser} by ${context.actor}`
            );

            // Someone added an assignee -> remove them.
            if (action === "assigned") {
              await github.rest.issues.removeAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                assignees: [changedUser]
              });
            }

            // Someone removed an assignee -> restore them.
            if (action === "unassigned") {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                assignees: [changedUser]
              });
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body:
                "⚠️ **Story assignments are managed by the instructor.** " +
                "Please do not change the assignee of a Story. " +
                "Assignment changes are allowed only on Tasks."
            });
