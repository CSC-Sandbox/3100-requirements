name: Protect Story Assignments

on:
  issues:
    types: [assigned, unassigned]

permissions:
  issues: write

jobs:
  protect-story-assignment:
    # Instructor can always change assignments.
    # Ignore changes made by bots, including this Action.
    if: >
      github.event.sender.login != 'javiergs' &&
      github.event.sender.type != 'Bot'

    runs-on: ubuntu-latest

    steps:
      - name: Protect assignments
        uses: actions/github-script@v8
        with:
          script: |
            const issue = context.payload.issue;
            const action = context.payload.action;
            const changedUser = context.payload.assignee?.login;

            const labels = (issue.labels || []).map(label =>
              typeof label === "string" ? label : label.name
            );

            const issueType = issue.type?.name;

            console.log(
              `Issue #${issue.number}: type=${issueType}, labels=${labels.join(", ")}`
            );

            // Only instructor-approved Stories/Features have protected assignments.
            // Tasks and all other issues are intentionally left editable by students.
            const isProtectedStory = labels.includes("story-accepted");

            if (!isProtectedStory) {
              console.log(
                "Issue is not an accepted Story/Feature; assignment change is allowed."
              );
              return;
            }

            if (!changedUser) {
              console.log("No changed assignee found.");
              return;
            }

            console.log(
              `Unauthorized ${action} of ${changedUser} by ${context.actor}`
            );

            if (action === "assigned") {
              await github.rest.issues.removeAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                assignees: [changedUser]
              });
            }

            if (action === "unassigned") {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                assignees: [changedUser]
              });
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body:
                "⚠️ **Story assignments are managed by the instructor.** " +
                "Please do not change the assignee of an accepted Story/Feature. " +
                "Assignment changes are allowed on Tasks and other issues."
            });
