name: Protect Feature Assignments

on:
  issues:
    types: [assigned, unassigned]

permissions:
  issues: write

jobs:
  protect-feature-assignment:
    # Instructor can always change assignments.
    # Ignore changes made by bots, including this Action.
    if: >
      github.event.sender.login != 'javiergs' &&
      github.event.sender.type != 'Bot'

    runs-on: ubuntu-latest

    steps:
      - name: Protect Feature assignment
        uses: actions/github-script@v8
        with:
          script: |
            const issue = context.payload.issue;
            const action = context.payload.action;
            const changedUser = context.payload.assignee?.login;

            // GitHub Issue Type
            const issueType = issue.type?.name;

            console.log(
              `Issue #${issue.number}: type=${issueType}, action=${action}`
            );

            // ONLY Features are protected.
            // Tasks and all other issue types may change assignees freely.
            if (issueType !== "Feature") {
              console.log(
                `Issue type is ${issueType}. Assignment changes are allowed.`
              );
              return;
            }

            if (!changedUser) {
              console.log("No changed assignee found.");
              return;
            }

            console.log(
              `Unauthorized ${action} of ${changedUser} on Feature #${issue.number} by ${context.actor}`
            );

            // Student added an assignee to a Feature -> undo it.
            if (action === "assigned") {
              await github.rest.issues.removeAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                assignees: [changedUser]
              });
            }

            // Student removed an assignee from a Feature -> restore it.
            if (action === "unassigned") {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                assignees: [changedUser]
              });
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body:
                "⚠️ **Feature assignments are managed by the instructor.** " +
                "Please do not change the assignee of a Feature. " +
                "Assignment changes on Tasks are allowed."
            });
