name: Sync story fields

on:
  issues:
    types: [opened]

jobs:
  sync-fields:
    runs-on: ubuntu-latest

    steps:
      - name: Read proposed values and update Issue Fields
        env:
          GH_TOKEN: ${{ secrets.ISSUE_FIELDS_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TYPE: ${{ github.event.issue.type.name }}
        shell: bash
        run: |
          set -euo pipefail

          # This workflow is for Stories/Features created from the issue form.
          # Student Tasks and other ordinary issues should not be treated as errors.
          if [[ "$ISSUE_TYPE" == "Task" ]]; then
            echo "Task detected; story fields do not apply."
            exit 0
          fi

          BODY=$(printf '%s\n' "$ISSUE_BODY" | tr -d '\r')

          PRIORITY=$(printf '%s\n' "$BODY" | awk '
            /^### Priority$/ {
              while (getline) {
                if ($0 != "") {
                  print
                  exit
                }
              }
            }
          ')

          ESTIMATE=$(printf '%s\n' "$BODY" | awk '
            /^### Estimation$/ {
              while (getline) {
                if ($0 != "") {
                  print
                  exit
                }
              }
            }
          ')

          echo "Priority: $PRIORITY"
          echo "Estimate: $ESTIMATE"

          # Issues that were not created from the Story form do not have these
          # headings. Skip them successfully instead of generating a failed run.
          if [[ -z "$PRIORITY" || -z "$ESTIMATE" ]]; then
            echo "Priority/Estimation not present; nothing to synchronize."
            exit 0
          fi

          FIELDS=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/orgs/$OWNER/issue-fields")

          PRIORITY_ID=$(printf '%s' "$FIELDS" | jq -r \
            '.[] | select(.name == "Priority") | .id')

          ESTIMATE_ID=$(printf '%s' "$FIELDS" | jq -r \
            '.[] | select(.name == "Estimate") | .id')

          echo "Priority field ID: $PRIORITY_ID"
          echo "Estimate field ID: $ESTIMATE_ID"

          if [[ -z "$PRIORITY_ID" || "$PRIORITY_ID" == "null" ]]; then
            echo "Priority Issue Field not found."
            exit 1
          fi

          if [[ -z "$ESTIMATE_ID" || "$ESTIMATE_ID" == "null" ]]; then
            echo "Estimate Issue Field not found."
            exit 1
          fi

          jq -n \
            --argjson priority_id "$PRIORITY_ID" \
            --arg priority "$PRIORITY" \
            --argjson estimate_id "$ESTIMATE_ID" \
            --arg estimate "$ESTIMATE" \
            '{
              issue_field_values: [
                {
                  field_id: $priority_id,
                  value: $priority
                },
                {
                  field_id: $estimate_id,
                  value: $estimate
                }
              ]
            }' > payload.json

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$OWNER/$REPO/issues/$ISSUE_NUMBER/issue-field-values" \
            --input payload.json
