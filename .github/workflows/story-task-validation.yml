name: Story and Task Validation

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate:
    name: Story and Task references
    runs-on: ubuntu-latest
    steps:
      - name: Validate Story and Task relationship
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request, urllib.error

          body = os.environ.get('PR_BODY', '')
          labels = json.loads(os.environ.get('PR_LABELS', '[]'))
          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          errors = []

          # Only authorized collaborators can apply repository labels.
          if 'instructor-maintenance' in labels:
              print('Instructor maintenance PR: Story/Task references are exempt.')
              sys.exit(0)

          def section(name):
              match = re.search(r'^##\s+' + re.escape(name) + r'\s*$([\s\S]*?)(?=^##\s+|\Z)', body, re.I | re.M)
              return match.group(1) if match else ''

          story_text = section('User Story')
          task_text = section('Tasks')
          story_refs = re.findall(r'(?<![\w/])#(\d+)\b', story_text)
          task_refs = re.findall(r'(?<![\w/])#(\d+)\b', task_text)
          if len(story_refs) != 1:
              errors.append('Provide exactly one Story issue number in the User Story section (e.g., Story: #135).')
          if not task_refs:
              errors.append('Provide at least one Task issue number in the Tasks section (e.g., - Task: #183).')

          def get(path):
              req = urllib.request.Request('https://api.github.com/' + path, headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'csc3100-pr-validator'
              })
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return None
                  raise

          if not errors:
              story_num = int(story_refs[0])
              story = get(f'repos/{repo}/issues/{story_num}')
              if not story or 'pull_request' in story:
                  errors.append(f'#{story_num} is not an existing issue in this repository.')
              else:
                  for value in dict.fromkeys(task_refs):
                      task_num = int(value)
                      task = get(f'repos/{repo}/issues/{task_num}')
                      if not task or 'pull_request' in task:
                          errors.append(f'Task #{task_num} is not an existing issue in this repository.')
                          continue
                      # GitHub REST exposes the parent issue through the sub-issue parent endpoint.
                      parent = get(f'repos/{repo}/issues/{task_num}/parent')
                      if not parent or parent.get('number') != story_num:
                          errors.append(f'Task #{task_num} must be a GitHub sub-issue of Story #{story_num}.')

          if errors:
              for error in errors:
                  print('::error::' + error)
              sys.exit(1)
          print(f'Validated Story #{story_num} and Task(s): ' + ', '.join('#' + x for x in dict.fromkeys(task_refs)))
          PY
